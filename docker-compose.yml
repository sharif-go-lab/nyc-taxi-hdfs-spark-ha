version: '3.8'

services:
  zookeeper:
    image: zookeeper:3.8
    container_name: zookeeper
    hostname: zookeeper
    ports:
      - '2181:2181'
    networks:
      - hadoop

  journalnode1:
    image: bde2020/hadoop-journalnode:2.0.0-hadoop3.3.2-java8
    container_name: journalnode1
    hostname: journalnode1
    environment:
      - CLUSTER_NAME=taxi
    volumes:
      - jn1:/hadoop/dfs/journalnode
    networks:
      - hadoop

  journalnode2:
    image: bde2020/hadoop-journalnode:2.0.0-hadoop3.3.2-java8
    container_name: journalnode2
    hostname: journalnode2
    environment:
      - CLUSTER_NAME=taxi
    volumes:
      - jn2:/hadoop/dfs/journalnode
    networks:
      - hadoop

  journalnode3:
    image: bde2020/hadoop-journalnode:2.0.0-hadoop3.3.2-java8
    container_name: journalnode3
    hostname: journalnode3
    environment:
      - CLUSTER_NAME=taxi
    volumes:
      - jn3:/hadoop/dfs/journalnode
    networks:
      - hadoop

  namenode1:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.3.2-java8
    container_name: namenode1
    hostname: namenode1
    ports:
      - '9870:9870'
    environment:
      - CLUSTER_NAME=taxi
      - CORE_CONF_fs_defaultFS=hdfs://taxi
      - HDFS_CONF_dfs_nameservices=taxi
      - HDFS_CONF_dfs_ha_namenodes_taxi=nn1,nn2
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn1=namenode1:8020
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn2=namenode2:8020
      - HDFS_CONF_dfs_namenode_http-address_taxi_nn1=namenode1:9870
      - HDFS_CONF_dfs_namenode_http-address_taxi_nn2=namenode2:9870
      - HDFS_CONF_dfs_client_failover_proxy_provider_taxi=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
      - HDFS_CONF_dfs_journalnode_edits_dir=/hadoop/dfs/journalnode
      - HDFS_CONF_dfs_namenode_shared_edits_dir=qjournal://journalnode1:8485;journalnode2:8485;journalnode3:8485/taxi
      - HDFS_CONF_dfs_ha_automatic-failover_enabled=true
    volumes:
      - nn1:/hadoop/dfs/namenode
      - ./hadoop-config:/etc/hadoop
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      - journalnode1
      - journalnode2
      - journalnode3
      - zookeeper
    networks:
      - hadoop

  namenode2:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.3.2-java8
    container_name: namenode2
    hostname: namenode2
    ports:
      - '9871:9870'
    environment:
      - CLUSTER_NAME=taxi
      - CORE_CONF_fs_defaultFS=hdfs://taxi
      - HDFS_CONF_dfs_nameservices=taxi
      - HDFS_CONF_dfs_ha_namenodes_taxi=nn1,nn2
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn1=namenode1:8020
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn2=namenode2:8020
      - HDFS_CONF_dfs_namenode_http-address_taxi_nn1=namenode1:9870
      - HDFS_CONF_dfs_namenode_http-address_taxi_nn2=namenode2:9870
      - HDFS_CONF_dfs_client_failover_proxy_provider_taxi=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
      - HDFS_CONF_dfs_journalnode_edits_dir=/hadoop/dfs/journalnode
      - HDFS_CONF_dfs_namenode_shared_edits_dir=qjournal://journalnode1:8485;journalnode2:8485;journalnode3:8485/taxi
      - HDFS_CONF_dfs_ha_automatic-failover_enabled=true
    volumes:
      - nn2:/hadoop/dfs/namenode
      - ./hadoop-config:/etc/hadoop
      - ./data:/data
      - ./scripts:/scripts
    depends_on:
      - journalnode1
      - journalnode2
      - journalnode3
      - zookeeper
    networks:
      - hadoop

  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.3.2-java8
    container_name: datanode1
    hostname: datanode1
    environment:
      - CLUSTER_NAME=taxi
      - CORE_CONF_fs_defaultFS=hdfs://taxi
      - HDFS_CONF_dfs_nameservices=taxi
      - HDFS_CONF_dfs_ha_namenodes_taxi=nn1,nn2
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn1=namenode1:8020
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn2=namenode2:8020
      - HDFS_CONF_dfs_client_failover_proxy_provider_taxi=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
      - SERVICE_PRECONDITION=namenode1:9870 namenode2:9870
    volumes:
      - dn1:/hadoop/dfs/datanode
      - ./hadoop-config:/etc/hadoop
    depends_on:
      - namenode1
      - namenode2
    networks:
      - hadoop

  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.3.2-java8
    container_name: datanode2
    hostname: datanode2
    environment:
      - CLUSTER_NAME=taxi
      - CORE_CONF_fs_defaultFS=hdfs://taxi
      - HDFS_CONF_dfs_nameservices=taxi
      - HDFS_CONF_dfs_ha_namenodes_taxi=nn1,nn2
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn1=namenode1:8020
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn2=namenode2:8020
      - HDFS_CONF_dfs_client_failover_proxy_provider_taxi=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
      - SERVICE_PRECONDITION=namenode1:9870 namenode2:9870
    volumes:
      - dn2:/hadoop/dfs/datanode
      - ./hadoop-config:/etc/hadoop
    depends_on:
      - namenode1
      - namenode2
    networks:
      - hadoop

  datanode3:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.3.2-java8
    container_name: datanode3
    hostname: datanode3
    environment:
      - CLUSTER_NAME=taxi
      - CORE_CONF_fs_defaultFS=hdfs://taxi
      - HDFS_CONF_dfs_nameservices=taxi
      - HDFS_CONF_dfs_ha_namenodes_taxi=nn1,nn2
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn1=namenode1:8020
      - HDFS_CONF_dfs_namenode_rpc-address_taxi_nn2=namenode2:8020
      - HDFS_CONF_dfs_client_failover_proxy_provider_taxi=org.apache.hadoop.hdfs.server.namenode.ha.ConfiguredFailoverProxyProvider
      - SERVICE_PRECONDITION=namenode1:9870 namenode2:9870
    volumes:
      - dn3:/hadoop/dfs/datanode
      - ./hadoop-config:/etc/hadoop
    depends_on:
      - namenode1
      - namenode2
    networks:
      - hadoop

  spark:
    build: ./spark
    container_name: spark
    hostname: spark
    depends_on:
      - namenode1
      - namenode2
    environment:
      - HADOOP_CONF_DIR=/opt/hadoop/etc/hadoop
    volumes:
      - ./hadoop-config:/opt/hadoop/etc/hadoop
      - ./spark/jars:/jars
      - ./data:/data
      - ./scripts:/scripts
    command: tail -f /dev/null
    networks:
      - hadoop

volumes:
  nn1:
  nn2:
  dn1:
  dn2:
  dn3:
  jn1:
  jn2:
  jn3:

networks:
  hadoop:
